# Olho d'Água — banco de desenvolvimento
# Sobe só o PostgreSQL com os bancos "cidadao" e "telemetria".
# Os serviços (.NET e Java) entram aqui depois, na etapa de Operating Systems.
#
#   docker compose -f infra/docker-compose.yml up -d
#
services:
  db:
    image: postgres:16
    container_name: olhodagua-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-olho}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-olho123}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-olho}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
